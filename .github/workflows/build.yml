name: Compiler l'APK Magic Arena

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le paquet du jeu (fichier .zip envoyé tel quel)
        run: |
          ls -1 Magicarena*.zip 2>/dev/null | sort -V | while IFS= read -r z; do
            echo "Décompression de $z"
            rm -rf paquet && unzip -o -q "$z" -d paquet
            find paquet -type f -exec mv -f {} . \;
          done
          rm -rf paquet

      - name: Vérifier que les fichiers du jeu sont là
        run: |
          if [ ! -f index.html ] && [ ! -f app/src/main/assets/index.html ]; then
            echo "Les fichiers du jeu ne sont pas encore envoyés : rien à compiler pour l'instant."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Ranger les fichiers dans le projet Android
        if: env.SKIP != '1'
        run: |
          A=app/src/main
          mkdir -p $A/java/com/leico/magicarena $A/assets/three/shaders $A/assets/three/postprocessing $A/assets/fonts
          m(){ if [ -f "$1" ]; then mv "$1" "$2"; fi; }
          m index.html $A/assets/index.html
          m three.min.js $A/assets/three/three.min.js
          m LICENSE-three.txt $A/assets/three/LICENSE-three.txt
          m CopyShader.js $A/assets/three/shaders/CopyShader.js
          m LuminosityHighPassShader.js $A/assets/three/shaders/LuminosityHighPassShader.js
          m EffectComposer.js $A/assets/three/postprocessing/EffectComposer.js
          m RenderPass.js $A/assets/three/postprocessing/RenderPass.js
          m ShaderPass.js $A/assets/three/postprocessing/ShaderPass.js
          m UnrealBloomPass.js $A/assets/three/postprocessing/UnrealBloomPass.js
          m fonts.css $A/assets/fonts/fonts.css
          m MainActivity.java $A/java/com/leico/magicarena/MainActivity.java
          m AndroidManifest.xml $A/AndroidManifest.xml
          m app.build.gradle app/build.gradle
          m magicarena.jks app/magicarena.jks
          for s in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
            n=${s%%:*}; d=${s##*:}; mkdir -p $A/res/mipmap-$d; m ic_launcher_$n.png $A/res/mipmap-$d/ic_launcher.png
          done
          for f in res__*; do [ -f "$f" ] || continue; r=${f#res__}; mkdir -p $A/res/${r%%__*}; mv "$f" $A/res/${r%%__*}/${r#*__}; done
          find app -type f | sort

      - uses: actions/setup
